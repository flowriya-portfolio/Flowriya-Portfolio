<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUXORA | Product Details</title>

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- GOOGLE FONTS -->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --olive: #4f5d32;
            --dark-olive: #344021;
            --soft-olive: #6f7b4d;
            --cream: #f8f7f3;
            --white: #ffffff;
            --dark: #24281d;
            --border: #dddcd4;
            --muted: #77786e;
        }

        body {
            font-family: "DM Sans", sans-serif;
            background: var(--cream);
            color: var(--dark);
            min-height: 100vh;
        }


        /* ================= HEADER ================= */

        .header {
            height: 78px;
            background: var(--white);
            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            width: 42px;
            height: 42px;

            border: 1px solid var(--border);
            background: var(--white);

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--olive);
            text-decoration: none;

            transition: .3s;
        }

        .back-btn:hover {
            background: var(--olive);
            color: var(--white);
        }

        .logo {
            text-decoration: none;
            color: var(--dark-olive);

            font-family: "Playfair Display", serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .header-bag {
            text-decoration: none;
            color: var(--olive);

            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 15px;
            font-weight: 600;
        }

        .header-bag span {
            width: 22px;
            height: 22px;

            border-radius: 50%;

            background: var(--olive);
            color: var(--white);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 11px;
        }


        /* ================= PRODUCT ================= */

        .product-page {
            max-width: 1200px;
            margin: auto;
            padding: 70px 6%;
        }

        .product-details {
            background: var(--white);

            display: grid;
            grid-template-columns: 1fr 1fr;

            min-height: 600px;

            border: 1px solid var(--border);
        }


        /* ================= IMAGE ================= */

        .product-image-area {
            background: #efeee8;

            min-height: 600px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow: hidden;
        }

        .product-image-area img {
            width: 100%;
            height: 600px;

            object-fit: cover;

            transition: transform .5s ease;
        }

        .product-image-area:hover img {
            transform: scale(1.03);
        }

        .product-tag {
            position: absolute;
            top: 25px;
            left: 25px;

            background: var(--olive);
            color: var(--white);

            padding: 8px 15px;

            font-size: 11px;
            letter-spacing: 1.5px;
            font-weight: 600;

            z-index: 2;
        }


        /* ================= WISHLIST ================= */

        .image-wishlist {
            position: absolute;
            top: 20px;
            right: 20px;

            width: 48px;
            height: 48px;

            border-radius: 50%;

            border: none;
            background: var(--white);

            color: var(--olive);

            cursor: pointer;

            font-size: 19px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 5px 20px rgba(0,0,0,.08);

            transition: .3s;

            z-index: 3;
        }

        .image-wishlist:hover {
            background: var(--olive);
            color: var(--white);
        }

        .image-wishlist.active {
            background: var(--olive);
            color: var(--white);
        }


        /* ================= INFO ================= */

        .product-info {
            padding: 70px 60px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-category {
            color: var(--soft-olive);

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 2px;
            text-transform: uppercase;

            margin-bottom: 18px;
        }

        .product-info h1 {
            font-family: "Playfair Display", serif;

            font-size: 46px;
            line-height: 1.15;

            color: var(--dark-olive);

            margin-bottom: 20px;
        }

        .product-price {
            font-family: "Playfair Display", serif;

            font-size: 30px;
            font-weight: 600;

            color: var(--olive);

            margin-bottom: 25px;
        }

        .line {
            width: 55px;
            height: 2px;

            background: var(--olive);

            margin-bottom: 25px;
        }

        .product-description {
            color: var(--muted);

            font-size: 16px;
            line-height: 1.8;

            max-width: 470px;

            margin-bottom: 35px;
        }


        /* ================= QUANTITY ================= */

        .quantity-title {
            font-size: 14px;
            font-weight: 600;

            margin-bottom: 12px;
        }

        .quantity-box {
            display: flex;
            align-items: center;

            width: 135px;
            height: 46px;

            border: 1px solid var(--border);

            margin-bottom: 25px;
        }

        .quantity-box button {
            width: 44px;
            height: 44px;

            border: none;
            background: transparent;

            color: var(--olive);

            font-size: 18px;

            cursor: pointer;
        }

        .quantity-box button:hover {
            background: #f0efe9;
        }

        .quantity-box span {
            flex: 1;

            text-align: center;

            font-size: 15px;
            font-weight: 600;
        }


        /* ================= BUTTONS ================= */

        .product-buttons {
            display: flex;
            gap: 12px;

            max-width: 470px;
            width: 100%;
        }

        .add-bag,
        .buy-now {
            height: 54px;

            border: none;

            cursor: pointer;

            font-family: "DM Sans", sans-serif;

            font-size: 15px;
            font-weight: 600;

            letter-spacing: .5px;

            transition: .3s;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }

        .add-bag {
            flex: 1;

            background: var(--olive);
            color: var(--white);
        }

        .add-bag:hover {
            background: var(--dark-olive);
        }

        .buy-now {
            flex: 1;

            background: var(--dark);
            color: var(--white);
        }

        .buy-now:hover {
            background: var(--olive);
        }


        /* ================= DETAILS ================= */

        .product-extra {
            display: flex;
            gap: 25px;

            margin-top: 30px;
            padding-top: 25px;

            border-top: 1px solid var(--border);
        }

        .extra-item {
            display: flex;
            align-items: center;
            gap: 10px;

            color: var(--muted);

            font-size: 13px;
        }

        .extra-item i {
            color: var(--olive);
            font-size: 16px;
        }


        /* ================= TOAST ================= */

        .toast {
            position: fixed;

            bottom: 25px;
            right: 25px;

            background: var(--dark-olive);
            color: var(--white);

            padding: 14px 20px;

            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 14px;

            transform: translateY(100px);
            opacity: 0;

            transition: .35s;

            z-index: 500;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }


        /* ================= TABLET ================= */

        @media (max-width: 800px) {

            .header {
                padding: 0 5%;
            }

            .logo {
                font-size: 22px;
            }

            .header-bag {
                font-size: 0;
            }

            .header-bag i {
                font-size: 20px;
            }

            .product-page {
                padding: 35px 5%;
            }

            .product-details {
                grid-template-columns: 1fr;
            }

            .product-image-area {
                min-height: 430px;
            }

            .product-image-area img {
                height: 430px;
            }

            .product-info {
                padding: 45px 30px;
            }

            .product-info h1 {
                font-size: 36px;
            }

            .product-buttons {
                flex-direction: column;
                max-width: 100%;
            }

            .add-bag,
            .buy-now {
                width: 100%;
                height: 58px;
                min-height: 58px;

                font-size: 17px;
            }

            .product-extra {
                flex-direction: column;
                gap: 15px;
            }
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .header {
                height: 68px;
                padding: 0 4%;
            }

            .header-left {
                gap: 12px;
            }

            .back-btn {
                width: 40px;
                height: 40px;
            }

            .logo {
                font-size: 21px;
                letter-spacing: 2px;
            }

            .header-bag i {
                font-size: 21px;
            }

            .header-bag span {
                width: 23px;
                height: 23px;
                font-size: 11px;
            }


            /* PAGE */

            .product-page {
                padding: 20px 4%;
            }


            /* IMAGE */

            .product-image-area,
            .product-image-area img {
                height: 350px;
                min-height: 350px;
            }

            .product-tag {
                top: 15px;
                left: 15px;

                padding: 8px 12px;

                font-size: 10px;
            }


            /* WISHLIST */

            .image-wishlist {
                width: 56px;
                height: 56px;

                top: 14px;
                right: 14px;

                font-size: 23px;
            }


            /* INFO */

            .product-info {
                padding: 35px 20px;
            }

            .product-category {
                font-size: 12px;
                letter-spacing: 1.7px;
                margin-bottom: 12px;
            }

            .product-info h1 {
                font-size: 31px;
                line-height: 1.25;
                margin-bottom: 14px;
            }

            .product-price {
                font-size: 26px !important;
                margin-bottom: 20px;
            }

            .line {
                margin-bottom: 20px;
            }

            .product-description {
                font-size: 16px !important;
                line-height: 1.7;
                margin-bottom: 25px;
            }


            /* QUANTITY */

            .quantity-title {
                font-size: 15px;
                margin-bottom: 10px;
            }

            .quantity-box {
                width: 155px;
                height: 54px;

                margin-bottom: 25px;
            }

            .quantity-box button {
                width: 52px;
                height: 52px;

                font-size: 25px;
            }

            .quantity-box span {
                font-size: 18px;
            }


            /* MAIN BUTTONS */

            .product-buttons {
                width: 100%;
                max-width: 100%;

                display: flex;
                flex-direction: column;

                gap: 12px;
            }

            .add-bag,
            .buy-now {
                width: 100%;

                height: 60px;
                min-height: 60px;

                padding: 0 20px;

                font-size: 17px !important;
                font-weight: 600;

                letter-spacing: .3px;

                border-radius: 6px;

                display: flex;
                align-items: center;
                justify-content: center;

                gap: 10px;
            }

            .add-bag i {
                font-size: 19px;
            }


            /* EXTRA */

            .product-extra {
                margin-top: 25px;
                padding-top: 20px;

                gap: 15px;
            }

            .extra-item {
                font-size: 14px;
            }

            .extra-item i {
                font-size: 17px;
            }


            /* TOAST */

            .toast {
                left: 15px;
                right: 15px;
                bottom: 15px;

                justify-content: center;

                padding: 15px 18px;

                font-size: 15px;
            }
        }


        /* ================= VERY SMALL PHONES ================= */

        @media (max-width: 380px) {

            .product-info {
                padding: 30px 17px;
            }

            .product-info h1 {
                font-size: 29px;
            }

            .product-price {
                font-size: 24px !important;
            }

            .product-description {
                font-size: 15px !important;
            }

            .image-wishlist {
                width: 53px;
                height: 53px;

                font-size: 22px;
            }

            .add-bag,
            .buy-now {
                height: 58px;
                min-height: 58px;

                font-size: 16px !important;
            }
        }

    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="header-left">

            <a href="menu.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <a href="index.html" class="logo">
                LUXORA
            </a>

        </div>


        <a href="menu.html" class="header-bag">

            <i class="fa-solid fa-bag-shopping"></i>

            BAG

            <span id="bagCount">0</span>

        </a>

    </header>



    <!-- ================= PRODUCT ================= -->

    <main class="product-page">

        <div class="product-details">


            <!-- IMAGE -->

            <div class="product-image-area">

                <span class="product-tag" id="productTag">
                    NEW
                </span>

                <button
                    class="image-wishlist"
                    id="wishlistBtn"
                    type="button"
                >
                    <i class="fa-regular fa-heart"></i>
                </button>

                <img
                    id="productImage"
                    src="images/img 8.jpg"
                    alt="Product"
                >

            </div>



            <!-- INFORMATION -->

            <div class="product-info">

                <div
                    class="product-category"
                    id="productCategory"
                >
                    FASHION
                </div>


                <h1 id="productName">
                    Elegant Silk Dress
                </h1>


                <div
                    class="product-price"
                    id="productPrice"
                >
                    $189
                </div>


                <div class="line"></div>


                <p
                    class="product-description"
                    id="productDescription"
                >
                    A graceful silk dress designed for an elegant
                    and effortless look.
                </p>


                <!-- QUANTITY -->

                <div class="quantity-title">
                    Quantity
                </div>

                <div class="quantity-box">

                    <button
                        id="minusBtn"
                        type="button"
                    >
                        −
                    </button>

                    <span id="quantity">
                        1
                    </span>

                    <button
                        id="plusBtn"
                        type="button"
                    >
                        +
                    </button>

                </div>


                <!-- BUTTONS -->

                <div class="product-buttons">

                    <button
                        class="add-bag"
                        id="addBagBtn"
                        type="button"
                    >
                        <i class="fa-solid fa-bag-shopping"></i>
                        Add to Bag
                    </button>

                    <button
                        class="buy-now"
                        id="buyNowBtn"
                        type="button"
                    >
                        Buy Now
                    </button>

                </div>


                <!-- EXTRA -->

                <div class="product-extra">

                    <div class="extra-item">

                        <i class="fa-solid fa-truck"></i>

                        <span>
                            Fast Delivery
                        </span>

                    </div>


                    <div class="extra-item">

                        <i class="fa-solid fa-shield-halved"></i>

                        <span>
                            Secure Order
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </main>



    <!-- ================= TOAST ================= -->

    <div class="toast" id="toast">

        <i class="fa-solid fa-check"></i>

        <span id="toastMessage">
            Added to bag
        </span>

    </div>



    <script>

        /* ================= PRODUCT ================= */

        const selectedProduct =
            JSON.parse(
                localStorage.getItem("luxoraSelectedProduct")
            );


        /* ================= ELEMENTS ================= */

        const productImage =
            document.querySelector("#productImage");

        const productName =
            document.querySelector("#productName");

        const productCategory =
            document.querySelector("#productCategory");

        const productPrice =
            document.querySelector("#productPrice");

        const productDescription =
            document.querySelector("#productDescription");

        const productTag =
            document.querySelector("#productTag");

        const quantityElement =
            document.querySelector("#quantity");

        const wishlistBtn =
            document.querySelector("#wishlistBtn");

        const bagCount =
            document.querySelector("#bagCount");

        const toast =
            document.querySelector("#toast");

        const toastMessage =
            document.querySelector("#toastMessage");


        /* ================= PRODUCT DATA ================= */

        let product = selectedProduct;


        if (!product) {

            product = {

                id: 1,

                name: "Elegant Silk Dress",

                category: "Fashion",

                price: 189,

                image: "images/img 8.jpg",

                tag: "NEW",

                description:
                    "A graceful silk dress designed for an elegant and effortless look."

            };

        }


        /* ================= SHOW PRODUCT ================= */

        productImage.src = product.image;

        productImage.alt = product.name;

        productName.textContent = product.name;

        productCategory.textContent =
            product.category.toUpperCase();

        productPrice.textContent =
            "$" + product.price;

        productDescription.textContent =
            product.description;

        productTag.textContent =
            product.tag;


        /* ================= QUANTITY ================= */

        let quantity = 1;


        document
            .querySelector("#plusBtn")
            .addEventListener("click", function () {

                quantity++;

                quantityElement.textContent =
                    quantity;

            });


        document
            .querySelector("#minusBtn")
            .addEventListener("click", function () {

                if (quantity > 1) {

                    quantity--;

                    quantityElement.textContent =
                        quantity;

                }

            });


        /* ================= CART ================= */

        let cartData =
            JSON.parse(
                localStorage.getItem("luxoraCart")
            ) || [];


        function updateBagCount() {

            let count = 0;

            cartData.forEach(function (item) {

                count += item.quantity;

            });

            bagCount.textContent = count;

        }


        updateBagCount();


        /* ================= TOAST ================= */

        function showToast(message) {

            toastMessage.textContent =
                message;

            toast.classList.add("show");

            setTimeout(function () {

                toast.classList.remove("show");

            }, 2200);

        }


        /* ================= ADD TO BAG ================= */

        document
            .querySelector("#addBagBtn")
            .addEventListener("click", function () {

                const existingItem =
                    cartData.find(function (item) {

                        return item.id === product.id;

                    });


                if (existingItem) {

                    existingItem.quantity +=
                        quantity;

                } else {

                    cartData.push({

                        ...product,

                        quantity: quantity

                    });

                }


                localStorage.setItem(
                    "luxoraCart",
                    JSON.stringify(cartData)
                );


                updateBagCount();

                showToast(
                    product.name + " added to bag"
                );

            });


        /* ================= BUY NOW ================= */

        document
            .querySelector("#buyNowBtn")
            .addEventListener("click", function () {

                const existingItem =
                    cartData.find(function (item) {

                        return item.id === product.id;

                    });


                if (existingItem) {

                    existingItem.quantity +=
                        quantity;

                } else {

                    cartData.push({

                        ...product,

                        quantity: quantity

                    });

                }


                localStorage.setItem(
                    "luxoraCart",
                    JSON.stringify(cartData)
                );


                window.location.href =
                    "order.html";

            });


        /* ================= WISHLIST ================= */

        let wishlistData =
            JSON.parse(
                localStorage.getItem("luxoraWishlist")
            ) || [];


        function updateWishlistButton() {

            const exists =
                wishlistData.some(function (item) {

                    return item.id === product.id;

                });


            if (exists) {

                wishlistBtn.classList.add("active");

                wishlistBtn.innerHTML =
                    '<i class="fa-solid fa-heart"></i>';

            } else {

                wishlistBtn.classList.remove("active");

                wishlistBtn.innerHTML =
                    '<i class="fa-regular fa-heart"></i>';

            }

        }


        updateWishlistButton();


        wishlistBtn.addEventListener(
            "click",
            function () {

                const index =
                    wishlistData.findIndex(
                        function (item) {

                            return item.id === product.id;

                        }
                    );


                if (index === -1) {

                    wishlistData.push(product);

                    showToast(
                        "Added to wishlist"
                    );

                } else {

                    wishlistData.splice(
                        index,
                        1
                    );

                    showToast(
                        "Removed from wishlist"
                    );

                }


                localStorage.setItem(
                    "luxoraWishlist",
                    JSON.stringify(wishlistData)
                );


                updateWishlistButton();

            }
        );

    </script>

</body>
</html>
